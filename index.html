    <script>
      (function() {
        if (typeof window !== 'undefined') {
          window.addEventListener('unhandledrejection', function(e) {
            if (e && e.reason && typeof e.reason.message === 'string' && e.reason.message.includes('WebSocket')) {
              e.preventDefault();
            }
          });
          window.addEventListener('error', function(e) {
            if (e && e.message && typeof e.message === 'string' && e.message.includes('WebSocket')) {
              e.preventDefault();
            }
          });
          if (window.WebSocket) {
            var OrigWebSocket = window.WebSocket;
            function MockHmrWebSocket(url, protocols) {
              var isHmr = (typeof protocols === 'string' && (protocols === 'vite-hmr' || protocols === 'vite-ping')) ||
                          (Array.isArray(protocols) && (protocols.indexOf('vite-hmr') !== -1 || protocols.indexOf('vite-ping') !== -1)) ||
                          (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('token=') !== -1));
              if (!isHmr) {
                return new OrigWebSocket(url, protocols);
              }
              this.url = String(url);
              this.readyState = 1;
              this.protocol = Array.isArray(protocols) ? protocols[0] : (protocols || '');
              this.extensions = '';
              this.bufferedAmount = 0;
              this.binaryType = 'blob';
              this.onopen = null;
              this.onclose = null;
              this.onerror = null;
              this.onmessage = null;
              this._listeners = {};
              var self = this;
              setTimeout(function() {
                if (typeof self.onopen === 'function') {
                  self.onopen(new Event('open'));
                }
                var openHandlers = self._listeners['open'] || [];
                openHandlers.forEach(function(fn) { fn(new Event('open')); });
              }, 0);
            }
            MockHmrWebSocket.prototype.addEventListener = function(type, listener) {
              this._listeners = this._listeners || {};
              this._listeners[type] = this._listeners[type] || [];
              this._listeners[type].push(listener);
              if (type === 'open' && this.readyState === 1) {
                setTimeout(function() { listener(new Event('open')); }, 0);
              }
            };
            MockHmrWebSocket.prototype.removeEventListener = function(type, listener) {
              if (!this._listeners || !this._listeners[type]) return;
              this._listeners[type] = this._listeners[type].filter(function(fn) { return fn !== listener; });
            };
            MockHmrWebSocket.prototype.dispatchEvent = function() { return true; };
            MockHmrWebSocket.prototype.send = function() {};
            MockHmrWebSocket.prototype.close = function() {
              this.readyState = 3;
              if (typeof this.onclose === 'function') {
                this.onclose(new CloseEvent('close'));
              }
              var closeHandlers = (this._listeners && this._listeners['close']) || [];
              closeHandlers.forEach(function(fn) { fn(new CloseEvent('close')); });
            };
            MockHmrWebSocket.CONNECTING = 0;
            MockHmrWebSocket.OPEN = 1;
            MockHmrWebSocket.CLOSING = 2;
            MockHmrWebSocket.CLOSED = 3;
            window.WebSocket = MockHmrWebSocket;
          }
        }
      })();
    </script>
