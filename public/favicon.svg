<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#112240" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#D8B979" />
      <stop offset="100%" stop-color="#806127" />
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#D8B979" stroke-width="2.5" />
  <!-- Anchor Ring -->
  <circle cx="32" cy="15" r="5" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <!-- Anchor Stock (Horizontal crossbar) -->
  <line x1="20" y1="24" x2="44" y2="24" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="20" cy="24" r="2" fill="url(#goldGrad)" />
  <circle cx="44" cy="24" r="2" fill="url(#goldGrad)" />
  <!-- Anchor Shank (Vertical shaft) -->
  <line x1="32" y1="18" x2="32" y2="51" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
  <!-- Anchor Arms (Curved bottom) -->
  <path d="M 14 38 C 14 53, 50 53, 50 38" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
  <!-- Flukes (Triangular arrow points) -->
  <polygon points="14,35 10,40 18,40" fill="url(#goldGrad)" />
  <polygon points="50,35 46,40 54,40" fill="url(#goldGrad)" />
  <!-- Center Crown / Palm -->
  <circle cx="32" cy="51" r="2.5" fill="url(#goldGrad)" />
</svg>
